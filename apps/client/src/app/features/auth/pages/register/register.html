<mat-card class="auth-card">

    <div class="logo">
        PP
    </div>

    <div class="header">

        <h1>Create Account</h1>

        <p>Create your ProductPilot account to get started.</p>

    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" class="full-width">

            <mat-label>Email</mat-label>

            <input matInput type="email" formControlName="email" placeholder="john@example.com">

            <mat-error *ngIf="form.controls.email.hasError('required')">
                Email is required
            </mat-error>

            <mat-error *ngIf="form.controls.email.hasError('email')">
                Enter a valid email
            </mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">

            <mat-label>Password</mat-label>

            <input matInput type="password" formControlName="password" placeholder="Create a strong password">

            <mat-error *ngIf="form.controls.password.hasError('required')">
                Password is required
            </mat-error>

        </mat-form-field>

        @if(error()){

        <div class="login-error">

            {{ error() }}

        </div>

        }

        <button mat-flat-button color="primary" class="login-btn" type="submit">

             @if(loading()){

        <mat-spinner diameter="20"></mat-spinner>

    } @else {

        Create Account

    }

        </button>

    </form>

    <div class="divider"></div>

    <p class="footer">

        Already have an account?

        <a routerLink="/login">
            Sign In
        </a>

    </p>

</mat-card>
